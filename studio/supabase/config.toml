# Minimal Supabase CLI config for LOCAL V2 persistence only (VHS-113 / VHS-115).
# project_id is a local label — NOT a remote project ref.
# Never run `supabase link` / `db push` from this workflow without separate written auth.
# Never commit secrets or remote service_role keys.

project_id = "virtual-humans-studio-local"

[api]
enabled = true
# Phase 10A-D: Hyper-V exclusion moved to 54852–55557; previous 54921–54923 blocked.
# Use classic local defaults 54321/54322/54323 (verified free on this host).
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Analytics disabled — optional services / port collisions on Windows.
[analytics]
enabled = false
